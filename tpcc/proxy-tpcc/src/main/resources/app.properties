warehouse_host=localhost
inventory_host=localhost
order_host=localhost
replica_host=localhost
gateway_host=localhost
gateway_port=8095



tcp_port=8091
network_thread_pool_size=4
network_buffer_size=0
so_buffer_size=0
network_send_timeout=0

# Larger batch configuration for unthrottled num_ware sweep.
# batch_sleep_ms=0 removes throttling entirely; T_tps is bounded
# only by the system's native OLTP capacity and the SSE ceiling.
batch_window_ms=500
num_max_transactions_batch=10000
batch_sleep_ms=500

num_vms_workers=1
num_queues_vms_worker=1
num_transaction_workers=1
max_sleep=0

logging=true
logging_type=default

checkpointing=true
checkpointing_truncate=true

vms_thread_pool_size=4
max_records=0

new_order=50
payment=50
order_status=0

num_ware=1
multi_ware=false

new_order_input_size=200000
payment_input_size=200000
order_status_input_size=200000

ordinal=100

# Live order VMS, no replica.
use_replica=false