# microservice http urls
warehouse_host=localhost
inventory_host=localhost
order_host=localhost

# coordinator network options
tcp_port=8091
network_thread_pool_size=0
network_buffer_size=0
so_buffer_size=0
network_send_timeout=0


# coordinator: vms worker options
num_vms_workers=1
num_queues_vms_worker=1
num_transaction_workers=1
max_sleep=0

# logging
logging=true
logging_type=default

checkpointing=true
checkpointing_truncate=true

# for micro benchmarks involving local TPC-C debugging
vms_thread_pool_size=0
max_records=0

# transaction ratios
new_order=100
payment=0
order_status=0

num_ware=1
multi_ware=false

# number of inputs per warehouse
payment_input_size=0

# maven shade merging priority
ordinal=100

populate=true
warmup_sec=2
measurement_sec=10

num_t_clients=2
alpha_max=2
output_csv=hattrick_results.csv
gateway_host=localhost
gateway_port=8095

# Reduce the pre-generated payload size so the proxy doesn't blow out its own memory
new_order_input_size=1000000
order_status_input_size=1000000

# Coordinator batch settings (force smaller, more manageable chunks for the VMS queues)
batch_window_ms=250
num_max_transactions_batch=25000